<style>
:root{
  --bg:#F4EDDF;
  --bg2:#EDE4D2;
  --card:#FFFDF7;
  --edge:#DFD4BE;
  --edge2:#C9BB9F;
  --ink:#22201B;
  --ink2:#4A463D;
  --muted:#8B8271;
  --rust:#A84923;
  --rust-bg:#F7E5DC;
  --olive:#5F7340;
  --olive-bg:#EAEDDC;
  --amber:#8A6216;
  --amber-bg:#F6EBD2;
  --disp:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --stencil:"Bebas Neue","Noto Sans KR",sans-serif;
  --sh:0 1px 2px rgba(60,45,20,.05),0 2px 8px rgba(60,45,20,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--ink);font-family:var(--disp);
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font-family:inherit}
img{display:block;max-width:100%}

#app{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;width:100%;max-width:600px;margin:0 auto;
  background:var(--bg);box-shadow:0 0 40px rgba(90,70,40,.07)}
#stack{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:0 0 100px;will-change:transform,opacity}
.view.enter-r{animation:inR .3s cubic-bezier(.22,.9,.28,1) both}
.view.exit-l{animation:outL .3s cubic-bezier(.4,0,.6,1) both}
.view.enter-l{animation:inL .3s cubic-bezier(.22,.9,.28,1) both}
.view.exit-r{animation:outR .3s cubic-bezier(.4,0,.6,1) both}
@keyframes inR{from{transform:translateX(24%);opacity:0}to{transform:none;opacity:1}}
@keyframes outL{from{transform:none;opacity:1}to{transform:translateX(-14%);opacity:0}}
@keyframes inL{from{transform:translateX(-20%);opacity:0}to{transform:none;opacity:1}}
@keyframes outR{from{transform:none;opacity:1}to{transform:translateX(22%);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;
  padding:calc(env(safe-area-inset-top) + 11px) 18px 11px;
  background:rgba(244,237,223,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge)}
.back{width:36px;height:36px;flex:0 0 36px;border:1px solid var(--edge2);border-radius:10px;
  display:grid;place-items:center;color:var(--ink2);background:var(--card)}
.back:active{transform:scale(.93)}
.top-t{font-weight:800;font-size:15.5px;letter-spacing:-.02em}
.top-s{font-family:var(--stencil);font-size:13px;letter-spacing:.16em;color:var(--olive)}

.hero{padding:20px 20px 20px;position:relative}
.eyebrow{font-family:var(--stencil);font-size:13px;letter-spacing:.32em;color:var(--olive);
  display:flex;align-items:center;gap:10px;padding-right:104px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--edge2)}
.hero h1{margin:10px 0 0;font-size:clamp(42px,14vw,58px);line-height:.9;font-weight:900;letter-spacing:-.05em}
.hero h1 em{font-style:normal;color:var(--rust)}
.hero .sub{color:var(--ink2);font-size:14px;margin-top:14px;max-width:34ch}
.stamp{position:absolute;right:16px;top:16px;transform:rotate(-9deg);
  border:2px solid rgba(168,73,35,.4);color:var(--rust);border-radius:6px;
  font-family:var(--stencil);font-size:12px;letter-spacing:.14em;padding:5px 9px 3px;line-height:1;text-align:center}
.stamp b{display:block;font-size:15px;letter-spacing:.08em}

.ladder{display:flex;align-items:flex-end;gap:6px;height:58px;padding:0 20px;margin:4px 0 4px}
.ladder i{flex:1;border-radius:4px 4px 0 0;background:var(--olive);opacity:.75;position:relative;
  transform-origin:bottom;animation:grow .55s cubic-bezier(.2,.9,.3,1) both}
.ladder i:last-child{background:var(--rust);opacity:1}
.ladder i b{position:absolute;top:-17px;left:0;right:0;text-align:center;
  font-family:var(--num);font-size:10px;color:var(--muted);font-weight:600}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.slab{display:flex;align-items:baseline;gap:10px;padding:0 20px;margin:24px 0 11px}
.slab h2{margin:0;font-size:14.5px;font-weight:800}
.slab span{font-family:var(--num);font-size:11px;color:var(--muted)}

.weeks{display:flex;flex-direction:column;gap:9px;padding:0 16px}
.wk{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--edge);border-left:4px solid var(--olive);
  border-radius:13px;padding:14px 15px;text-align:left;width:100%;box-shadow:var(--sh);
  animation:pop .36s cubic-bezier(.2,.9,.3,1) both}
.wk:active{transform:scale(.985);background:#FFF9EC}
.wk.peak{border-left-color:var(--rust)}
.wk-n{font-family:var(--stencil);font-size:38px;line-height:.82;color:var(--olive);display:flex;align-items:baseline;gap:3px}
.wk-n small{font-family:var(--disp);font-size:11px;font-weight:700;color:var(--muted)}
.wk.peak .wk-n{color:var(--rust)}
.wk-b{min-width:0}
.wk-b b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.wk-b span{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:var(--num);font-size:10.5px;font-weight:600;color:var(--amber);
  background:var(--amber-bg);border-radius:6px;padding:4px 7px;white-space:nowrap}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px}
.tile{background:var(--card);border:1px solid var(--edge);border-radius:13px;padding:15px;text-align:left;box-shadow:var(--sh)}
.tile:active{background:#FFF9EC}
.tile b{display:block;font-size:14.5px;font-weight:800}
.tile span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.tile .ic{color:var(--olive);margin-bottom:9px;display:block}

.termbar{margin:2px 16px 14px;padding:12px 14px;border-radius:11px;
  background:var(--amber-bg);border:1px solid #E7D6AE}
.termbar b{font-family:var(--num);color:var(--amber);font-size:12.5px;font-weight:600}
.termbar p{margin:3px 0 0;font-size:13px;color:var(--ink2)}
.days{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.day{display:grid;grid-template-columns:46px 1fr auto auto;align-items:center;gap:13px;
  background:var(--card);border:1px solid var(--edge);border-radius:13px;padding:12px 14px;
  text-align:left;width:100%;box-shadow:var(--sh);animation:pop .32s cubic-bezier(.2,.9,.3,1) both}
.day:active{transform:scale(.985);background:#FFF9EC}
.day-d{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;
  background:var(--olive-bg);border:1px solid #D3DABF;font-size:17px;font-weight:900;color:var(--olive)}
.day.done .day-d{background:var(--rust-bg);border-color:#E9C4B4;color:var(--rust)}
.day-b b{display:block;font-size:15px;font-weight:800}
.day-b span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.day-s{margin-right:6px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.day.done .day-s{color:var(--rust)}
.day.late{background:rgba(140,47,30,.07);border-color:rgba(140,47,30,.3)}
.day.late .day-s{color:#8C2F1E}
.day.next{outline:2px solid var(--rust);outline-offset:-2px}
.chev{color:var(--edge2)}

.dayhead{padding:16px 20px 14px}
.dayhead .k{font-family:var(--stencil);font-size:13px;letter-spacing:.26em;color:var(--olive)}
.dayhead h2{margin:5px 0 0;font-size:29px;font-weight:900;letter-spacing:-.04em;line-height:1.08}
.dayhead .m{font-family:var(--num);font-size:11.5px;color:var(--muted);margin-top:8px}
.grouphead{display:flex;align-items:center;gap:11px;padding:0 20px;margin:22px 0 10px;
  font-family:var(--stencil);font-size:14px;letter-spacing:.2em;color:var(--ink2)}
.grouphead::after{content:"";flex:1;height:1px;background:var(--edge2)}

.blk{margin:0 16px 10px;background:var(--card);border:1px solid var(--edge);border-radius:14px;
  overflow:hidden;box-shadow:var(--sh);animation:pop .3s cubic-bezier(.2,.9,.3,1) both}
.blk.main{border-color:#E5C7B8}
.blk-t{display:flex;align-items:center;gap:12px;padding:11px 12px}
.blk.main .blk-t{background:var(--rust-bg)}
.thumb{width:62px;height:62px;flex:0 0 62px;border-radius:10px;overflow:hidden;
  border:1px solid var(--edge2);background:#fff;position:relative;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb::after{content:"사진";position:absolute;left:0;right:0;bottom:0;text-align:center;
  font-size:9px;font-weight:700;letter-spacing:.04em;color:#fff;background:rgba(34,32,27,.62);padding:1px 0 2px}
.blk-t .nm{flex:1;min-width:0}
.blk-t .rl{font-family:var(--stencil);font-size:11.5px;letter-spacing:.16em;color:var(--olive);display:block}
.blk.main .blk-t .rl{color:var(--rust)}
.blk-t .nm b{display:block;font-size:17px;font-weight:900;letter-spacing:-.03em;margin-top:1px}
.sets{border-top:1px solid var(--edge)}
.set{display:flex;align-items:center;gap:11px;padding:10px 13px;border-bottom:1px solid #F0E9DA}
.set:last-child{border-bottom:0}
.set .no{font-family:var(--stencil);font-size:12.5px;letter-spacing:.1em;color:var(--muted);width:46px;flex:0 0 46px}
.set .wt{font-family:var(--num);font-size:20px;font-weight:600;letter-spacing:-.04em;color:var(--ink)}
.set .wt u{text-decoration:none;color:var(--muted);font-size:13px;margin:0 3px}
.set .tp{margin-left:auto;font-family:var(--num);font-size:10.5px;font-weight:600;color:var(--amber);
  background:var(--amber-bg);border-radius:5px;padding:3px 6px}
.spec{padding:10px 13px;border-top:1px solid var(--edge);display:flex;align-items:center;gap:9px}
.spec .q{font-family:var(--num);font-size:16px;color:var(--ink);font-weight:600}
.spec .lbl{font-size:12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 13px 13px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);border-radius:10px;
  padding:6px 9px 6px 6px;font-size:12.5px;background:#FFF;text-align:left;font-weight:500}
.opt:active{background:#FFF4E0}
.opt img{width:38px;height:38px;flex:0 0 38px;border-radius:7px;object-fit:cover;border:1px solid var(--edge)}
.pick-note{padding:0 13px 12px;font-size:11.5px;color:var(--muted);margin:0}
.note{margin:0 16px 10px;padding:12px 14px;border-radius:11px;font-size:13px;
  background:var(--rust-bg);border:1px solid #E9C4B4;color:#7E3517}
.latebar{margin:10px 16px;padding:10px 13px;border-radius:9px;
  background:rgba(140,47,30,.1);border:1px solid rgba(140,47,30,.3);
  font-size:12.5px;font-weight:700;color:#8C2F1E}

.donebar{padding:20px 16px 8px}
.donebtn{width:100%;border:1px solid var(--edge2);border-radius:13px;padding:15px;
  font-weight:800;font-size:15px;background:var(--card);box-shadow:var(--sh)}
.donebtn.on{background:var(--rust-bg);border-color:#E0A88F;color:var(--rust)}
.donebtn:active{transform:scale(.985)}
.doneat{margin-top:7px;text-align:center;font-size:11.5px;color:var(--muted)}
.pager{display:flex;gap:9px;padding:10px 16px 0}
.pager button{flex:1;border:1px solid var(--edge);border-radius:12px;padding:13px;font-size:13px;
  color:var(--ink2);background:var(--card)}
.pager button:disabled{opacity:.35}
.pager button:active{background:#FFF4E0}

.rule{display:grid;grid-template-columns:28px 1fr;gap:13px;align-items:start;margin:0 16px 8px;
  background:var(--card);border:1px solid var(--edge);border-radius:13px;padding:14px;box-shadow:var(--sh);
  animation:pop .28s cubic-bezier(.2,.9,.3,1) both}
.rule .n{font-family:var(--stencil);font-size:20px;color:var(--rust);line-height:1;text-align:center;padding-top:3px}
.rule p{margin:0;font-size:14px;white-space:pre-line}
.rule .sub{display:block;margin-top:6px;font-size:12.5px;color:var(--muted);white-space:pre-line}

.card{margin:0 16px 12px;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 3px;font-size:15px;font-weight:800}
.card .hint{margin:0 0 14px;font-size:12px;color:var(--muted)}
.frow{display:flex;gap:9px;align-items:flex-end}
.f{flex:1}
.f label{display:block;font-family:var(--stencil);font-size:11.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:5px}
.f input{width:100%;background:#FBF7EC;border:1px solid var(--edge2);border-radius:10px;padding:12px;
  color:var(--ink);font-family:var(--num);font-size:18px;font-weight:600}
.f input:focus{outline:none;border-color:var(--olive);background:#fff}
.out{margin-top:14px;padding:14px;border-radius:11px;background:var(--amber-bg);border:1px solid #E7D6AE;
  display:flex;align-items:baseline;gap:9px}
.out span{font-size:12.5px;color:var(--ink2)}
.out b{font-family:var(--num);font-size:27px;font-weight:600;color:var(--amber);letter-spacing:-.04em}
.pcts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:13px}
.pct{background:#FBF7EC;border:1px solid var(--edge);border-radius:8px;padding:7px 3px;text-align:center}
.pct i{display:block;font-family:var(--num);font-size:9.5px;color:var(--muted);font-style:normal}
.pct b{display:block;font-family:var(--num);font-size:13.5px;font-weight:600;color:var(--ink);margin-top:2px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw .t{font-size:13.5px;font-weight:800}
.sw .d{font-size:12px;color:var(--muted);margin-top:3px}
.toggle{width:50px;height:29px;flex:0 0 50px;border-radius:99px;background:#E4DAC5;
  border:1px solid var(--edge2);position:relative;transition:.22s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:99px;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.22s}
.toggle.on{background:var(--rust);border-color:var(--rust)}
.toggle.on::after{left:24px}

.nav{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(244,237,223,.96);backdrop-filter:blur(12px);border-top:1px solid var(--edge2);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{padding:10px 0 9px;display:grid;justify-items:center;gap:3px;color:var(--muted)}
.nav button.on{color:var(--rust)}
.nav b{font-size:10.5px;font-weight:700}

.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(50,40,25,.42);opacity:0;pointer-events:none;transition:opacity .24s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet-in{width:100%;max-width:600px;background:var(--bg);border-radius:20px 20px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 20px);
  transform:translateY(102%);transition:transform .3s cubic-bezier(.22,.9,.28,1);max-height:94%;overflow-y:auto}
.sheet.open .sheet-in{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--edge2);margin:0 auto 14px;cursor:pointer}
.sheet h3{margin:2px 0 0;font-size:22px;font-weight:900;letter-spacing:-.035em}
.sheet .role{font-family:var(--stencil);font-size:11.5px;letter-spacing:.2em;color:var(--olive)}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 11px}
.fr{margin:0;background:var(--card);border:1px solid var(--edge);border-radius:13px;overflow:hidden;box-shadow:var(--sh)}
.fr-i{position:relative;background:#fff}
.fr-i img{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.fr-n{position:absolute;left:8px;top:8px;font-family:var(--stencil);font-size:15px;line-height:1;
  color:#fff;background:var(--rust);border-radius:6px;padding:4px 8px 2px}
.fr figcaption{padding:9px 11px 11px;border-top:1px solid var(--edge)}
.fr figcaption b{display:block;font-size:13px;font-weight:800}
.fr figcaption span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.tband{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;margin-bottom:13px;
  border:1px solid #E7D6AE;border-radius:11px;background:var(--amber-bg);font-size:13px;color:#6B4E12}
.tband b{color:var(--amber);font-family:var(--num);font-weight:600;flex:0 0 auto}
.cues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cues li{display:flex;gap:10px;font-size:13.5px;color:var(--ink2)}
.cues li::before{content:"—";color:var(--olive);flex:0 0 auto}
.subnote{margin:12px 0 0;padding:11px 13px;border-radius:10px;background:var(--olive-bg);
  border:1px solid #D3DABF;font-size:12.5px;color:#4A5A32}
.ytb{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--edge2);
  border-radius:12px;padding:13px;margin-top:14px;font-size:13.5px;font-weight:700;color:var(--ink2);
  text-decoration:none;background:var(--card)}
.ytb:active{background:#FFF4E0}
.disc{margin:12px 0 0;font-size:11.5px;color:var(--muted);line-height:1.55}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
.warn{flex:none;padding:10px 14px;
  background:#8C2F1E;color:#fff;font-size:12.5px;line-height:1.5;
  box-shadow:0 2px 10px rgba(0,0,0,.25)}
.warn[hidden]{display:none}

.status{margin:14px 16px 4px;padding:18px 16px 16px;background:var(--bg2);
  border:1px solid rgba(0,0,0,.08);border-radius:14px;text-align:center}
#silhouette{display:flex;justify-content:center;min-height:150px}
#silhouette svg{width:120px;height:140px}
.st-name{margin-top:10px;display:flex;gap:7px;justify-content:center;align-items:center}
.st-name b{font-size:20px;font-weight:900;letter-spacing:-.02em}
.st-name i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--rust);
  border:1px solid var(--rust);border-radius:4px;padding:1px 5px}
.st-sub{margin-top:3px;font-size:11.5px;color:var(--muted)}
.st-bar{margin:12px 0 8px;height:7px;border-radius:4px;background:rgba(0,0,0,.1);overflow:hidden}
.st-bar i{display:block;height:100%;background:var(--rust);transition:width .45s ease}
.st-num{display:flex;gap:5px;justify-content:center;align-items:baseline;font-variant-numeric:tabular-nums}
.st-num b{font-size:26px;font-weight:900}
.st-num span{font-size:13px;color:var(--muted)}
.st-num em{margin-left:8px;font-style:normal;font-size:13px;font-weight:700;color:var(--rust)}
.st-last{margin-top:8px;font-size:11.5px;color:var(--muted)}

.nextcard{display:block;width:calc(100% - 32px);margin:12px 16px;padding:14px 16px;
  text-align:left;background:var(--rust);color:#fff;border:0;border-radius:12px;cursor:pointer}
.nextcard .lb{display:block;font-size:11px;font-weight:700;opacity:.85;letter-spacing:.04em}
.nextcard b{display:block;margin-top:5px;font-size:16px;font-weight:800}
.nextcard .dt{display:block;margin-top:3px;font-size:12px;opacity:.8}
.nextcard.done{background:#2E2A24}

.warnslab h2{color:#8C2F1E}
.backlog{margin:0 16px}
.bl{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:6px;padding:11px 13px;
  background:rgba(140,47,30,.07);border:1px solid rgba(140,47,30,.25);border-radius:10px;
  text-align:left;cursor:pointer}
.bl .dot{width:7px;height:7px;border-radius:50%;background:#8C2F1E;flex:none}
.bl b{flex:1;font-size:13.5px;font-weight:700}
.bl .chev{display:flex;color:var(--muted)}
.ladder i.full{opacity:1}
.wk.cleared .tag{background:var(--rust);color:#fff}
#silhouette{cursor:pointer}
.sil-empty{fill:rgba(0,0,0,.16);stroke:rgba(0,0,0,.16)}
.sil-full{fill:var(--rust);stroke:var(--rust)}
.sil-glow{filter:drop-shadow(0 0 6px var(--rust));opacity:.75}
.stagelist{margin:14px 0 4px}
.sg{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:5px;
  border-radius:9px;background:rgba(0,0,0,.04);font-size:13.5px}
.sg-l{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(0,0,0,.12);font-size:11px;font-weight:800}
.sg b{font-weight:700}
.sg-n{flex:1;text-align:left;padding-left:6px;font-size:11px;color:var(--muted)}
.sg-r{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sg.past{opacity:.55}
.sg.on{background:rgba(140,47,30,.12);outline:1.5px solid var(--rust)}
.sg.on .sg-l{background:var(--rust);color:#fff}

.btnrow{display:flex;gap:8px;margin-top:10px}
.mbtn{flex:1;padding:11px;border:1px solid rgba(0,0,0,.18);border-radius:9px;
  background:var(--bg);font-size:13px;font-weight:700;cursor:pointer}
.mbtn.danger{width:100%;margin-top:10px;border-color:rgba(140,47,30,.4);color:#8C2F1E}
.bk{width:100%;margin-top:9px;padding:9px;border:1px solid rgba(0,0,0,.15);border-radius:8px;
  font-family:ui-monospace,monospace;font-size:11px;resize:vertical;background:var(--bg)}
.bkmsg{margin-top:7px;font-size:12px;min-height:16px}
.bkmsg.good{color:var(--rust)}
.bkmsg.bad{color:#8C2F1E;font-weight:700}
</style>
</head>
<body>
<div id="warn" class="warn" hidden></div>
<div id="app"><div id="stack"></div><nav class="nav" id="nav"></nav></div>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<script type="module" src="assets/app.js?v=3"></script>
</body>
